<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="x-apple-disable-message-reformatting">
  <title>Welcome to FirstFour</title>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>

<body style="margin: 0; padding: 0; width: 100%; font-family: Helvetica, Arial, sans-serif;">
  <table role="presentation" align="center" width="100%" cellpadding="0" cellspacing="0" border="0"
    style="width: 100%; max-width: 600px; margin: 0 auto; background-color: #ffffff;border: 1px solid #000;">
    <!-- HEADER -->
    <tr>
      <td style="padding: 0 48px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
          style="width: 100%; background-color: #00308f;">
          <tr>
            <td style="padding: 44px 40px 0 40px;">
              <img src="" width="165" height="40" alt="FirstFour" style="width: 165px; height: 40px;">
            </td>
          </tr>
          <tr>
            <td class="title"
              style="padding: 52px 40px 0 40px; font-family: Helvetica, Arial, sans-serif; font-size: 48px; line-height: 56px; font-weight: 400; color: #ffffff; letter-spacing: -0.5px;">
              Your FirstFour workspace is ready.
            </td>
          </tr>
          <tr>
            <td style="padding: 28px 40px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse: separate;">
                <tr>
                  <td align="center" bgcolor="#FCE4E4" style="background-color: #ffffff; border-radius: 10px;">
                    <a href="{{ ActivateUrl }}" target="_blank"
                      style="display: inline-block; padding: 18px 40px; font-family: Helvetica, Arial, sans-serif; font-size: 20px; line-height: 26px; color: #00308f; text-decoration: none; border-radius: 32px;">
                      Activate my account
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
    <!-- CONTENT -->
    <tr>
      <td>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width: 100%;">
          <tr>
            <td style="padding: 24px 48px;"></td>
          </tr>
        </table>
      </td>
    </tr>
    <!-- FOOTER -->
    <tr>
      <td style="padding: 0 48px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
          style="width: 100%; background-color: #00308f;">
          <tr>
            <td style="padding: 24px 48px;"></td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
<script>
  lucide.createIcons({ attrs: { width: 22, height: 22, stroke: '#FE0000', 'stroke-width': 2 } });
</script>

</html>
